# Minecraft & NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.241
neo_version_range=[21.1.241,21.2.0)
loader_version_range=[4,5)

# Mod Properties
mod_id=ae2modularcells
mod_name=AE2 Modular Energy Units
mod_license=LGPL-3.0
mod_version=0.1.0
mod_group_id=io.github.lounode.ae2modularcells
# 作者名用 \uXXXX 转义：gradle.properties 按 ISO-8859-1 读入，直接写中文会被双重编码，展开进模组元数据
# 后就成了「æè½」（玩家在模组列表里能看到）。转义写法与 java.util.Properties 同规，展开仍是中文。
mod_authors=\u661F\u843D
mod_description=An Applied Energistics 2 add-on for NeoForge 1.21.1: modular energy units that snap together into a single solid-cube energy storage, with per-block component slots feeding one shared energy pool.

# 本机专属取值（JDK 路径、Windows 信任库、代理）已经搬到你自己的用户级配置文件：
#   ~/.gradle/gradle.properties（Windows 上是 %USERPROFILE%\.gradle\gradle.properties）
# 那里不入库，也不会把某台机器的路径带给克隆者。CI/其他机器要覆盖时用命令行：
#   -Dorg.gradle.java.home="$JAVA_HOME" -Dorg.gradle.jvmargs="...trustStoreType=JKS"
# （jvmargs 里的 Windows-ROOT 信任库在 Linux 上不是合法 keystore 类型，所以它也只能放在用户级配置里。）
# org.gradle.java.home=
