modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ae2"
type="required"
versionRange="[19.0.0,)"
ordering="NONE"
side="BOTH"

# GuideME：AE2 指南书与配置屏所在的库。AE2 本体已把它声明为必需依赖，这里显式列出——
# 实现阶段的机器屏会覆写 AEBaseScreen#getHelpTopic()，那个方法的返回类型就是 guideme 的 PageAnchor。
[[dependencies.${mod_id}]]
modId="guideme"
type="required"
versionRange="*"
ordering="NONE"
side="BOTH"

# JEI 可选、且只在客户端：配方转移入口（从 JEI 配方页把材料导进编辑区）是唯一用到的面，
# IRecipeTransferListener / IRecipeTransferContext / RecipeTransferResult 均自 19.52.0 起。
# 上限压在 19.x：20.0.0 换了配方类型体系，是另一条 Minecraft 线。
[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[19.52.0,20.0.0)"
ordering="AFTER"
side="CLIENT"

# EMI 可选、客户端：JEI 不在场时由它提供配方页的导入入口。1.1.22 是本模组编译所用的 API。
[[dependencies.${mod_id}]]
modId="emi"
type="optional"
versionRange="[1.1.22,)"
ordering="AFTER"
side="CLIENT"

# MEGA Cells 可选：cell_component_1m ~ 256m 是槽位的高档组件来源之一（另一个是 AppFlux），
# 它的 Superdense Energy Cell 也是等级数值的对照参考。组件识别优先走 AE2 的公开接口；确实要引用它的
# 类型时一律放进 integration 包并按 mod id 门禁。不设版本地板——它缺席时槽位只认剩下的那些来源。
[[dependencies.${mod_id}]]
modId="megacells"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"

# AppFlux（Applied Flux）可选：core_1k ~ 256m（ME Energy Storage Component）覆盖全部十档，是槽位组件的
# 主要来源。同 MEGA Cells：优先走 AE2 公开接口，要引其类型就进 integration 包加门禁，不设版本地板。
# 它的必需前置（AE2 / GuideME / Glodium）都由玩家整合包负责，本模组不声明。
[[dependencies.${mod_id}]]
modId="appflux"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"

# Jade 可选、且只在客户端：M7 的方块信息浮层集成对着它写。浮层是纯客户端的事，所以 side=CLIENT——
# 它缺席时只是没浮层，其余照常。
[[dependencies.${mod_id}]]
modId="jade"
type="optional"
versionRange="*"
ordering="AFTER"
side="CLIENT"
